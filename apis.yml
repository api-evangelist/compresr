aid: compresr
name: Compresr
description: >-
  Compresr is an LLM context-compression API. You send the long context you would
  otherwise pass to a model plus the query you want answered, and Compresr returns a
  shorter context that keeps the answer-bearing spans and drops the rest — fewer input
  tokens, lower cost, a longer effective context window, and faster inference. It sits
  in front of whatever LLM stack you already use and replaces nothing. The public API
  exposes query-specific compression models (latte_v1 and the faster latte_v2) plus
  tool-output, conversation-history, and tool-discovery variants, over a hosted HTTP
  API with Python and TypeScript SDKs, first-party framework integrations (LangChain,
  LangGraph, LlamaIndex, LiteLLM), and per-key tiered rate limits. Compresr Inc. is a
  Y Combinator W26 company built by four EPFL-trained researchers in San Francisco,
  California and Switzerland.
