        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/admin/settings/excluded-patterns:
    get:
      tags:
      - Admin
      summary: Get Excluded Patterns
      description: 'Get all excluded email patterns grouped by source.


        Returns patterns from:

        - **patterns**: Editable patterns stored in DB (managed here)

        - **hardcoded**: Built-in patterns (e.g. "compresr.ai") -- cannot be removed

        - **env_patterns**: Patterns from STATS_EXCLUDED_EMAIL_PATTERNS env var -- read-only'
      operationId: get_excluded_patterns_api_admin_settings_excluded_patterns_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExcludedPatternsResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - HTTPBearer: []
    post:
      tags:
      - Admin
      summary: Add Excluded Pattern
      description: 'Add a new excluded email pattern (Admin only).


        Patterns are matched as substrings against user emails and names.

        Examples: "@test.com", "staging", "internal".'
      operationId: add_excluded_pattern_api_admin_settings_excluded_patterns_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddExcludedPatternRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
    delete:
      tags:
      - Admin
      summary: Remove Excluded Pattern
      description: 'Remove an excluded email pattern (Admin only).


        Cannot remove built-in patterns like "compresr.ai".'
      operationId: remove_excluded_pattern_api_admin_settings_excluded_patterns_delete
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemoveExcludedPatternRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/admin/settings/pilot-patterns:
