openapi: 3.2.0
info:
  title: Compresr Platform OAuth Authorization API
  version: 1.0.0
tags:
- name: OAuth Authorization
paths:
  /api/authorize/cli-token:
    post:
      tags:
      - OAuth Authorization
      summary: Get Cli Token
      description: Get or create the user's CLI Key for Context Gateway CLI.
      operationId: get_cli_token_api_authorize_cli_token_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CLIKeyResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - HTTPBearer: []
      - HTTPBearer: []
  /api/authorize/logout:
    post:
      tags:
      - OAuth Authorization
      summary: Logout
      description: Revoke the calling API key; report success only after confirmed revocation.
      operationId: logout_api_authorize_logout_post
      parameters:
      - name: X-API-Key
        in: header
        required: true
        schema:
          type: string
          title: X-Api-Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/authorize/ws-callback:
    post:
      tags:
      - OAuth Authorization
      summary: Ws Callback
      description: Deliver a CLI key to a waiting WebSocket session (called by the frontend after browser authorization).
      operationId: ws_callback_api_authorize_ws_callback_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WsCallbackRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WsCallbackResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
      - HTTPBearer: []
components:
  schemas:
    WsCallbackResponse:
      properties:
        success:
          type: boolean
          title: Success
        message:
          type: string
          title: Message
      type: object
      required:
      - success
      - message
      title: WsCallbackResponse
    LogoutResponse:
      properties:
        success:
          type: boolean
          title: Success
        revoked_key_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Revoked Key Id
        message:
          type: string
          title: Message
      type: object
      required:
      - success
      - message
      title: LogoutResponse
    ErrorResponse:
      properties:
        success:
          type: boolean
          title: Success
          default: false
        error:
          type: string
          title: Error
        code:
          type: string
          title: Code
        detail:
          anyOf:
          - type: string
          - type: 'null'
          title: Detail
        retry_after:
          anyOf:
          - type: integer
          - type: 'null'
          title: Retry After
        field:
          anyOf:
          - type: string
          - type: 'null'
          title: Field
      type: object
      required:
      - error
      - code
      title: ErrorResponse
    WsCallbackRequest:
      properties:
        ws_session:
          type: string
          title: Ws Session
        state:
          type: string
          title: State
      type: object
      required:
      - ws_session
      - state
      title: WsCallbackRequest
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    CLIKeyResponse:
      properties:
        success:
          type: boolean
          title: Success
        token:
          type: string
          title: Token
        message:
          type: string
          title: Message
      type: object
      required:
      - success
      - token
      - message
      title: CLIKeyResponse
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
x-provenance:
  method: harvested
  publisher: Compresr
  source: https://api.compresr.ai/openapi.json
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)
